name: Release Build (arm64-v8a)

on:
  push:
    branches:
      - feat/channel-search-block-posts
    paths:
      - '.github/workflows/build-arm64-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare workspace
        run: |
          mkdir -p patches
          if [ ! -f patches/search-blacklist-channels-searchposts.patch ]; then
            curl -fsSL https://aka.doubaocdn.com/s/F5PbZM2Ijr -o patches/search-blacklist-channels-searchposts.patch
          fi

      - name: Apply patch and commit to branch
        run: |
          PATCH=patches/search-blacklist-channels-searchposts.patch
          head -n 1 "$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply "$PATCH"
            git add TMessagesProj/src/main/java "$PATCH"
            git commit -m "feat(search): cover channels.searchPosts with channel search blacklist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "patch committed to ${GITHUB_REF_NAME}"
          elif git apply --check --reverse "$PATCH" 2>/dev/null; then
            echo "patch already applied on this branch"
          else
            echo "patch does not apply cleanly"; exit 1
          fi
          grep -n "isSearchBlacklistedMessage" TMessagesProj/src/main/java/moe/hx030/momogram/MomoConfig.java | head -n 3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK / NDK / build tools
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)"
          fi
          yes | sudo "$SDK_MANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            --sdk_root="$ANDROID_SDK_ROOT"
          yes | sudo "$SDK_MANAGER" --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null || true
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${NDK_VERSION}" >> local.properties
          cat local.properties
          ls "$ANDROID_HOME/ndk"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson ninja-build gperf cmake pkg-config

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Restrict native dependencies to arm64-v8a
        run: |
          python3 - <<'PY'
          import re, sys

          def replace(path, old, new):
              s = open(path, encoding='utf-8').read()
              if old not in s:
                  sys.exit(f'pattern not found in {path}: {old!r}')
              open(path, 'w', encoding='utf-8').write(s.replace(old, new, 1))

          replace('bin/init/libs/ffmpeg.sh',
                  './build_ffmpeg_clang.sh || exit 1',
                  './build_ffmpeg_clang.sh arm64 || exit 1')
          replace('bin/init/libs/libvpx.sh',
                  './build_libvpx_clang.sh || exit 1',
                  './build_libvpx_clang.sh arm64 || exit 1')
          replace('bin/init/libs/boringssl.sh',
                  './build_boringssl.sh $@',
                  './build_boringssl.sh arm64')

          p = 'TMessagesProj/jni/build_tde2e.sh'
          s = open(p, encoding='utf-8').read()
          s2, n = re.subn(r"declare -ra architectures=\([^)]*\)",
                          "declare -ra architectures=(\n\t'arm64-v8a'\n)", s, count=1)
          if n != 1:
              sys.exit('tde2e architectures array not found')
          open(p, 'w', encoding='utf-8').write(s2)
          print('native deps restricted to arm64-v8a')
          PY

      - name: Native dependency cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/prebuild/lib
            TMessagesProj/jni/prebuild/build
            TMessagesProj/jni/prebuild/tlottie-build
            TMessagesProj/jni/third_party/ffmpeg/build
            TMessagesProj/jni/third_party/libvpx/build
            TMessagesProj/jni/third_party/dav1d/build
            TMessagesProj/jni/third_party/boringssl/build
            TMessagesProj/jni/td/build
          key: deps-${{ github.sha }}-arm64

      - name: Build native dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          ABIS: arm64-v8a
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export NDK="$ANDROID_NDK_HOME"
          ./run init libs 2>&1 | tee /tmp/deps.log
          tail -n 20 /tmp/deps.log

      - name: Limit native build to arm64-v8a
        run: |
          python3 - <<'PY'
          import re
          p = 'TMessagesProj/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = re.search(r"//\s*ndk \{\n(?://.*\n)+//\s*\}", s)
          if not block:
              raise SystemExit('ndk abiFilters block not found, layout changed')
          s = s[:block.start()] + '        ndk {\n            abiFilters "arm64-v8a"\n        }' + s[block.end():]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n -A2 "ndk {" TMessagesProj/build.gradle | head -n 20

      - name: Build native libs
        env:
          NATIVE_TARGET: arm64-v8a
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export NDK="$ANDROID_NDK_HOME"
          export COMPILE_NATIVE=1
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --continue TMessagesProj:stripFossDebugSymbols 2>&1 | tee /tmp/native.log
          OUT=TMessagesProj/build/intermediates/stripped_native_libs/foss/stripFossDebugSymbols/out/lib
          mkdir -p TMessagesProj/src/main/libs/arm64-v8a
          cp -v "$OUT"/arm64-v8a/libtmessages*.so TMessagesProj/src/main/libs/arm64-v8a/
          ls -lh TMessagesProj/src/main/libs/arm64-v8a

      - name: Assemble Release
        env:
          NATIVE_TARGET: arm64-v8a
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          APK_CERT: ${{ secrets.APK_CERT }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export NDK="$ANDROID_NDK_HOME"
          if [ -n "${APK_CERT:-}" ]; then
            printf "%s" "$APK_CERT" > /tmp/ci.jks.b64
            base64 -d /tmp/ci.jks.b64 > /tmp/ci.jks || true
          fi
          for d in $(ls TMessagesProj_Modules/media3/libraries 2>/dev/null); do
            touch "TMessagesProj_Modules/media3/libraries/$d/proguard-rules.txt" || true
          done
          ./gradlew --no-daemon --stacktrace TMessagesProj:assembleRelease 2>&1 | tee /tmp/assemble.log

      - name: Collect APK
        run: |
          APK="$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find TMessagesProj/build/outputs -maxdepth 4 -type f | head -n 50
            exit 1
          fi
          OUT="Momogram-$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"
          unzip -l "$OUT" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/' | head -n 20 || true
          sha256sum "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momogram-arm64-v8a-release
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p ci
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "sha: ${GITHUB_SHA}"
            echo "=== deps.log tail ==="
            tail -n 150 /tmp/deps.log 2>/dev/null || echo "(no deps log)"
            echo "=== native.log tail ==="
            tail -n 400 /tmp/native.log 2>/dev/null || echo "(no native log)"
            echo "=== assemble.log tail ==="
            tail -n 200 /tmp/assemble.log 2>/dev/null || echo "(no assemble log)"
          } > ci/last-failure.log
          git add -f ci/last-failure.log
          git commit -m "ci: capture failure log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log
          path: ci/last-failure.log
          if-no-files-found: ignore
